<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Motor híbrido interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #E7EEF2;
    --tinta: #12283A;
    --tinta-suave: #4A6072;
    --plano: #1B6F9A;
    --brasa: #E8590C;
    --tarjeta: #F8FBFC;
    --borde: rgba(18, 40, 58, .22);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--papel); color: var(--tinta);
    font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--plano); outline-offset: 2px; }

  /* Lienzo con cuadrícula de plano técnico */
  #stage {
    position: fixed; inset: 0;
    background-color: var(--papel);
    background-image:
      linear-gradient(rgba(18,40,58,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(18,40,58,.055) 1px, transparent 1px);
    background-size: 32px 32px;
    touch-action: none;
  }
  #stage canvas { display: block; touch-action: none; }

  #cabecera { position: fixed; top: 20px; left: 24px; pointer-events: none; }
  #titulo {
    margin: 0; font-family: 'Barlow Condensed', system-ui, sans-serif;
    font-weight: 700; font-size: 38px; line-height: 1; letter-spacing: .01em;
  }
  #pista { margin: 6px 0 0; color: var(--tinta-suave); font-size: 17px; transition: opacity .3s; }
  #pista.oculta { opacity: 0; }

  /* Lista de piezas reducida un 45% (Ancho 115px) y ocultable */
  #lista {
    position: fixed; left: 16px; top: 100px; bottom: 200px; width: 115px;
    display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
    padding: 2px; -webkit-overflow-scrolling: touch;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 5;
  }
  #lista.oculto-lista {
    opacity: 0;
    pointer-events: none;
    transform: translateX(-20px);
  }
  #lista button {
    display: flex; align-items: center; gap: 6px; text-align: left;
    min-height: 36px; padding: 6px 8px;
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 6px;
    font-size: 12px; font-weight: 500;
  }
  #lista button .muestra { width: 10px; height: 10px; border-radius: 2px; flex: none; border: 1px solid rgba(18,40,58,.35); }
  #lista button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lista button[aria-pressed="true"] { border-color: var(--brasa); box-shadow: inset 3px 0 0 var(--brasa); font-weight: 600; }

  /* Acciones arriba a la derecha */
  #acciones { position: fixed; top: 20px; right: 20px; display: flex; gap: 8px; z-index: 10; }
  #acciones button {
    min-height: 44px; padding: 0 14px; background: var(--tarjeta);
    border: 1px solid var(--borde); border-radius: 6px; font-size: 15px; font-weight: 500;
  }
  #acciones button[aria-pressed="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }

  /* Ficha de la pieza ARRASTRABLE */
  #panel {
    position: fixed; right: 20px; top: 76px; width: min(340px, 85vw); max-height: 60vh;
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px;
    padding: 22px 22px 20px; overflow-y: auto;
    display: none;
    box-shadow: 0 10px 30px rgba(18,40,58,.2);
    z-index: 20;
    touch-action: none;
  }
  #panel.abierto { display: block; }
  #panel-header {
    cursor: move;
    padding-bottom: 8px;
    margin-bottom: 8px;
    border-bottom: 2px stroke var(--borde);
  }
  #panel h2 {
    margin: 0 36px 0 0; font-family: 'Barlow Condensed', system-ui, sans-serif;
    font-weight: 700; font-size: 30px; line-height: 1.05; color: var(--brasa);
  }
  #cerrar {
    position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
    border: 1px solid var(--borde); border-radius: 6px; background: transparent; font-size: 20px; line-height: 1;
  }
  #p-desc { margin: 10px 0 16px; font-size: 16px; line-height: 1.4; }
  #p-datos { margin: 0; }
  #p-datos .fila { padding: 8px 0; border-top: 1px solid var(--borde); }
  #p-datos dt { font-size: 13px; color: var(--tinta-suave); font-weight: 500; }
  #p-datos dd { margin: 2px 0 0; font-size: 17px; font-weight: 600; }
  #p-datos dd.vacio { color: #9AAAB6; font-weight: 400; font-style: italic; }

  /* Controles inferiores */
  #controles-contenedor {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: min(600px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 8px;
    z-index: 10;
  }
  .bloque-control {
    padding: 8px 18px 10px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px;
    box-shadow: 0 4px 15px rgba(18,40,58,.1);
  }
  .bloque-control label { display: block; font-family: 'Barlow Condensed', system-ui, sans-serif; font-weight: 600; font-size: 18px; margin-bottom: 2px; }
  .bloque-control .fila { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--tinta-suave); }
  .bloque-control .fila span { flex: none; }
  .bloque-control input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 38px; background: transparent; margin: 0; }
  
  #explosion::-webkit-slider-runnable-track, #zoom::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--plano), var(--brasa)); }
  #explosion::-moz-range-track, #zoom::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--plano), var(--brasa)); }
  #explosion::-webkit-slider-thumb, #zoom::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: #fff; border: 3px solid var(--tinta); }
  #explosion::-moz-range-thumb, #zoom::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 3px solid var(--tinta); }

  #estado {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 32px; text-align: center; font-size: 22px; background: rgba(231,238,242,.92);
  }
  #estado.oculto { display: none; }
  #estado.error { color: #9B1C1C; }

  @media (max-width: 760px) {
    #titulo { font-size: 30px; }
    #lista { top: auto; bottom: 180px; left: 12px; right: 12px; width: auto; flex-direction: row; overflow-x: auto; overflow-y: hidden; }
    #lista button { flex: none; }
    #panel { top: auto; right: 12px; left: 12px; bottom: 230px; width: auto; max-height: 38vh; }
    #acciones { top: 14px; right: 12px; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<header id="cabecera">
  <h1 id="titulo">Motor híbrido</h1>
  <p id="pista">Toca una pieza para conocerla</p>
</header>

<nav id="lista" aria-label="Piezas del motor"></nav>

<div id="acciones">
  <button id="btn-toggle-lista" type="button" aria-pressed="true">👁️ Piezas</button>
  <button id="btn-corte" type="button" aria-pressed="false">Corte Transversal</button>
  <button id="btn-girar" type="button" aria-pressed="true">Girar solo</button>
  <button id="btn-reset" type="button">Reiniciar</button>
</div>

<aside id="panel" aria-live="polite" aria-hidden="true">
  <div id="panel-header">
    <button id="cerrar" type="button" aria-label="Cerrar ficha">&times;</button>
    <h2 id="p-titulo"></h2>
  </div>
  <p id="p-desc"></p>
  <dl id="p-datos"></dl>
</aside>

<div id="controles-contenedor">
  <div class="bloque-control">
    <label for="explosion">Explosionar</label>
    <div class="fila">
      <span>Armado</span>
      <input id="explosion" type="range" min="0" max="100" value="0" aria-label="Separar las piezas del motor">
      <span>Explosionado</span>
    </div>
  </div>

  <div class="bloque-control">
    <label for="zoom">Zoom (Acercar/Alejar)</label>
    <div class="fila">
      <span>Cerca</span>
      <input id="zoom" type="range" min="0" max="100" value="50" aria-label="Ajustar nivel de zoom de la cámara">
      <span>Lejos</span>
    </div>
  </div>
</div>

<div id="estado" role="status">Cargando modelo…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ==========================================================================
   1. CONFIGURACIÓN
   ========================================================================== */
const CONFIG = {
  modelo: 'motor.glb',            
  titulo: 'Motor híbrido',
  ensamble: 'Ensamble macho',     
  ignorar: ['Cube'],              
  ejeMotor: 'auto',               
  expansion: 1.4,                 
  colorear: true,                 
  rotacionAutomatica: true,       
  aMilimetros: 1000               
};

const AL = { material: 'Aluminio 6061', tempMax: 'Pierde resistencia desde ~150 °C y se debilita mucho por encima de 200 °C' };
const FEN = { material: 'Fenólico', tempMax: 'Se descompone y carboniza entre ~350 y 850 °C (así protege lo que tiene detrás)' };

const PIEZAS = {
  'Injector': {
    ...AL, titulo: 'Inyector',
    queEs: 'Es la regadera del motor: reparte el oxidante, lo que permite que el combustible se queme, para que entre de forma pareja.',
    presion: '',
    medidas: 'Cabeza de Ø76.2 mm, 55 mm de largo total',
    extra: { 'Orificios de inyección': '10 orificios de Ø1.24 mm', 'Entrada del oxidante': 'Rosca G 1/4 (BSPP)' }
  },
  'Injector case': {
    ...AL, titulo: 'Carcasa del inyector',
    queEs: 'Aloja el inyector y lo mantiene alineado y sellado.',
    presion: '',
    medidas: 'Brida de Ø120 mm, cuerpo de Ø65 mm, 45 mm de largo total'
  },
  'Brida Injector': {
    ...AL, titulo: 'Brida del inyector',
    queEs: 'Anillo atornillado que une y sella el extremo del inyector con el resto del motor.',
    presion: '',
    medidas: 'Ø120 mm, 20 mm de grosor'
  },
  'Casing': {
    ...AL, titulo: 'Carcasa (casing)',
    queEs: 'Es el tubo exterior del motor: resiste la presión de adentro y le da resistencia estructural. Lleva una brida soldada en cada extremo para unir el resto de las piezas.',
    presion: '', medidas: '',
    extra: { 'Bridas': '2 bridas soldadas de Ø116 mm y 20 mm de grosor' },
    explosion: { lift: 0.5 }
  },
  'Fenolico': {
    ...FEN, titulo: 'Aislante fenólico',
    queEs: 'Capa que protege la carcasa del calor de la combustión. Se va carbonizando poco a poco para cuidar lo que hay detrás.',
    presion: '', medidas: '',
    explosion: { lift: 0.25 }
  },
  'Pre-CC': {
    ...FEN, titulo: 'Precámara de combustión',
    queEs: 'Espacio antes del combustible donde el oxidante se mezcla y se estabiliza antes de empezar a quemarse.',
    presion: '',
    medidas: 'Ø exterior 65 mm, Ø interior 51 mm, 23 mm de largo'
  },
  'Grano': {
    titulo: 'Grano (combustible)',
    queEs: 'Es el combustible sólido del motor. Al pasar el oxidante por su canal central se quema y genera los gases calientes que dan el empuje.',
    material: 'HDPE (polietileno de alta densidad)',
    tempMax: 'Se funde a ~130 °C y se descompone a ~400 °C; se consume al quemarse',
    presion: '', medidas: ''
  },
  'Injerto': {
    titulo: 'Injerto de grafito',
    queEs: 'Pieza de grafito que forma la garganta, el punto más angosto de la tobera. Ahí los gases van muy rápido y muy calientes, por eso se usa un material que aguanta temperaturas extremas.',
    material: 'Grafito',
    tempMax: 'Más de 2 200 °C',
    presion: '',
    medidas: 'Ø exterior 45 mm, 40.67 mm de largo',
    extra: { 'Diámetro de la garganta': '≈ 33.9 mm' }
  },
  'Tobera': {
    ...FEN, titulo: 'Tobera',
    queEs: 'Es la salida en forma de campana: acelera los gases calientes y los convierte en empuje.',
    presion: '',
    medidas: 'Largo 138.33 mm, Ø máximo 75 mm',
    extra: { 'Diámetro de salida': '52.05 mm' }
  },
  'Brida Tobera': {
    ...AL, titulo: 'Brida de la tobera',
    queEs: 'Anillo atornillado que une y sella la tobera en el extremo de salida del motor.',
    presion: '',
    medidas: 'Brida de Ø120 mm, cuerpo de Ø85 mm, 65 mm de largo total'
  }
};

/* ==========================================================================
   2. UTILIDADES
   ========================================================================== */
const $ = s => document.querySelector(s);
const clave = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const claveInfo = s => clave(s).replace(/\d+$/, '');
const INFO = new Map(Object.entries(PIEZAS).map(([n, d]) => [claveInfo(n), { ...d, _nombre: n }]));
const reducirMovimiento = matchMedia('(prefers-reduced-motion: reduce)').matches;

const estadoEl = $('#estado');
function mensaje(texto, esError = false) {
  estadoEl.textContent = texto;
  estadoEl.classList.toggle('error', esError);
  estadoEl.classList.remove('oculto');
}

$('#titulo').textContent = CONFIG.titulo;
document.title = CONFIG.titulo;

/* ==========================================================================
   3. ESCENA Y PLANO DE CORTE TRANSVERSAL SÓLIDO (CAPS)
   ========================================================================== */
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, stencil: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.localClippingEnabled = true; 
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const planoCorte = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);
let corteActivo = false;

// Malla que cubre el plano para simular relleno sólido en el corte
const capGroup = new THREE.Group();
scene.add(capGroup);

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.autoRotateSpeed = 0.9;

function ajustarTamano() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(ajustarTamano).observe(stage);
ajustarTamano();

/* ==========================================================================
   4. CARGA Y PREPARACIÓN DEL MODELO
   ========================================================================== */
let partes = [];
let actual = null;
let t = 0, objetivoT = 0;
let girarAuto = CONFIG.rotacionAutomatica && !reducirMovimiento;
let encuadrar = () => {};
let aplicarExplosion = () => {};
let lineaCentro = null;
let centroGeneral = new THREE.Vector3();
let distMinCamara = 0.5, distMaxCamara = 10;

new GLTFLoader().load(
  CONFIG.modelo,
  gltf => {
    try { iniciar(gltf); estadoEl.classList.add('oculto'); }
    catch (e) { console.error(e); mensaje('El modelo cargó, pero no se pudo preparar: ' + e.message, true); }
  },
  xhr => { if (xhr.total) mensaje('Cargando modelo… ' + Math.round(100 * xhr.loaded / xhr.total) + ' %'); },
  err => {
    console.error(err);
    mensaje('No se pudo cargar ' + CONFIG.modelo + '. Revisa que el archivo esté en la raíz de tu proyecto.', true);
  }
);

function iniciar(gltf) {
  const modelo = gltf.scene;

  const ignorar = CONFIG.ignorar.map(clave);
  const quitar = [];
  modelo.traverse(o => { if (o.isCamera || o.isLight || (o !== modelo && ignorar.includes(clave(o.name)))) quitar.push(o); });
  quitar.forEach(o => o.parent && o.parent.remove(o));
  scene.add(modelo);
  modelo.updateMatrixWorld(true);

  const buscar = k => { let r = null; modelo.traverse(o => { if (!r && o !== modelo && clave(o.name) === k) r = o; }); return r; };
  const tieneMalla = o => { let v = false; o.traverse(c => { if (c.isMesh) v = true; }); return v; };
  const hijosValidos = r => r.children.filter(c => tieneMalla(c));
  let raiz = buscar(clave(CONFIG.ensamble)) || modelo;
  let objs = hijosValidos(raiz);
  while (objs.length === 1 && !objs[0].isMesh && objs[0].children.length) { raiz = objs[0]; objs = hijosValidos(raiz); }
  if (!objs.length) { objs = []; modelo.traverse(o => { if (o.isMesh) objs.push(o); }); }
  if (!objs.length) throw new Error('el GLB no contiene piezas con geometría.');

  const caja = new THREE.Box3().setFromObject(raiz);
  const tam = caja.getSize(new THREE.Vector3());
  const centro = caja.getCenter(new THREE.Vector3());
  centroGeneral.copy(centro);
  planoCorte.constant = centro.x;

  const ejes = ['x', 'y', 'z'];
  const eje = CONFIG.ejeMotor === 'auto' ? ejes.reduce((a, b) => (tam[b] > tam[a] ? b : a)) : CONFIG.ejeMotor;
  const otros = ejes.filter(e => e !== eje);
  const L = tam[eje];
  const dirEje = new THREE.Vector3(); dirEje[eje] = 1;
  const dirArriba = eje === 'y' ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);

  partes = objs.map(obj => {
    const pt = { obj, meshes: [], mats: [] };
    pt.clave = clave(obj.name);
    pt.info = INFO.get(claveInfo(obj.name)) || null;
    pt.titulo = (pt.info && pt.info.titulo) || obj.name.replace(/_/g, ' ');

    obj.traverse(m => {
      if (!m.isMesh) return;
      
      // Renderizado sólido rellenando las caras traseras al cortar
      m.material = Array.isArray(m.material) ? m.material.map(x => x.clone()) : m.material.clone();
      (Array.isArray(m.material) ? m.material : [m.material]).forEach(x => { 
        x.side = THREE.DoubleSide; 
        x.shadowSide = THREE.DoubleSide;
        pt.mats.push(x); 
      });
      m.userData.parte = pt;
      pt.meshes.push(m);
    });

    const cajaP = new THREE.Box3().setFromObject(obj);
    const c = cajaP.getCenter(new THREE.Vector3());
    pt.rel = L > 0 ? (c[eje] - centro[eje]) / L : 0;

    const s = new THREE.Box3().setFromObject(obj, true).getSize(new THREE.Vector3());
    const largo = Math.round(s[eje] * CONFIG.aMilimetros);
    const diam = Math.round(Math.max(s[otros[0]], s[otros[1]]) * CONFIG.aMilimetros);
    pt.medidasModelo = 'Largo ' + largo + ' mm, diámetro ' + diam + ' mm';
    return pt;
  });

  partes.sort((a, b) => a.rel - b.rel);
  partes.forEach((pt, i) => {
    const color = new THREE.Color().setHSL((i * 0.618034) % 1, 0.5, 0.58);
    let hex = '#9AAAB6';
    pt.mats.forEach(m => {
      if (CONFIG.colorear && m.color) { m.color.copy(color); if ('metalness' in m) { m.metalness = 0.25; m.roughness = 0.55; } }
      if (m.color) hex = '#' + m.color.getHexString();
    });
    pt.hex = hex;

    const ex = (pt.info && pt.info.explosion) || {};
    const axial = typeof ex.axial === 'number' ? ex.axial : pt.rel * CONFIG.expansion;
    const lift = typeof ex.lift === 'number' ? ex.lift : 0;
    const mundo = dirEje.clone().multiplyScalar(axial * L).addScaledVector(dirArriba, lift * L);
    const padre = pt.obj.parent;
    padre.updateWorldMatrix(true, false);
    const inv = new THREE.Matrix4().copy(padre.matrixWorld).invert();
    const origen = new THREE.Vector3().applyMatrix4(inv);
    pt.base = pt.obj.position.clone();
    pt.desplazamiento = mundo.applyMatrix4(inv).sub(origen);
  });

  const mitad = L * (1 + CONFIG.expansion) * 0.6;
  const geo = new THREE.BufferGeometry().setFromPoints([
    centro.clone().addScaledVector(dirEje, -mitad),
    centro.clone().addScaledVector(dirEje, mitad)
  ]);
  const matLinea = new THREE.LineDashedMaterial({ color: 0x1B6F9A, dashSize: L * 0.025, gapSize: L * 0.015, transparent: true, opacity: 0 });
  lineaCentro = new THREE.Line(geo, matLinea);
  lineaCentro.computeLineDistances();
  scene.add(lineaCentro);

  aplicarExplosion = () => {
    partes.forEach(pt => pt.obj.position.copy(pt.base).addScaledVector(pt.desplazamiento, t));
    matLinea.opacity = 0.6 * Math.min(1, t * 2.5);
  };

  const luz = new THREE.DirectionalLight(0xffffff, 1.3);
  luz.position.copy(centro).add(new THREE.Vector3(1, 2, 1.5).multiplyScalar(Math.max(L, 0.1)));
  luz.target.position.copy(centro);
  scene.add(luz, luz.target);

  const vista = (eje === 'z' ? new THREE.Vector3(1, 0.3, 0.25) : new THREE.Vector3(0.25, 0.3, 1)).normalize();
  
  encuadrar = () => {
    const fov = THREE.MathUtils.degToRad(camera.fov);
    const fovH = 2 * Math.atan(Math.tan(fov / 2) * camera.aspect);
    const ancho = L * (1 + CONFIG.expansion * 0.6);
    const diamMax = Math.max(tam[otros[0]], tam[otros[1]]);
    const alto = diamMax + L * 0.4;
    const dist = 1.25 * Math.max((ancho / 2) / Math.tan(fovH / 2), (alto / 2) / Math.tan(fov / 2)) + diamMax / 2;
    
    distMinCamara = dist * 0.25;
    distMaxCamara = dist * 2.2;
    
    camera.position.copy(centro).addScaledVector(vista, dist);
    controls.target.copy(centro);
    camera.near = dist / 100; camera.far = dist * 20;
    camera.updateProjectionMatrix();
    controls.minDistance = distMinCamara;
    controls.maxDistance = distMaxCamara;
    controls.update();
    $('#zoom').value = 50;
  };
  encuadrar();
  controls.autoRotate = girarAuto;

  construirLista();
}

/* ==========================================================================
   5. SELECCIÓN Y FICHA
   ========================================================================== */
function estadoVisual(pt, modo) {
  for (const m of pt.mats) {
    if ('emissive' in m) {
      if (modo === 'sel') { m.emissive.set(0xE8590C); m.emissiveIntensity = 0.5; }
      else { m.emissive.set(0x000000); m.emissiveIntensity = 1; }
    }
    m.transparent = modo === 'dim';
    m.opacity = modo === 'dim' ? 0.16 : 1;
    m.depthWrite = modo !== 'dim';
  }
}

function seleccionar(pt) {
  actual = pt;
  partes.forEach(p => estadoVisual(p, !pt ? 'normal' : (p === pt ? 'sel' : 'dim')));
  partes.forEach(p => p.boton && p.boton.setAttribute('aria-pressed', String(p === pt)));
  if (pt) { $('#pista').classList.add('oculta'); controls.autoRotate = false; }
  else if (girarAuto) controls.autoRotate = true;
  mostrarFicha(pt);
}

function mostrarFicha(pt) {
  const panel = $('#panel');
  panel.classList.toggle('abierto', !!pt);
  panel.setAttribute('aria-hidden', String(!pt));
  if (!pt) return;
  
  panel.style.left = '';
  panel.style.top = '';

  const info = pt.info || {};
  $('#p-titulo').textContent = pt.titulo;
  $('#p-desc').textContent = info.queEs || 'Descripción por completar.';
  const filas = [
    ['Material', info.material],
    ['Temperatura límite del material', info.tempMax],
    ['Presión de trabajo', info.presion],
    [info.medidas ? 'Medidas' : 'Medidas (tomadas del modelo)', info.medidas || pt.medidasModelo]
  ].concat(Object.entries(info.extra || {}));
  const dl = $('#p-datos');
  dl.replaceChildren();
  for (const [etiqueta, valor] of filas) {
    const fila = document.createElement('div'); fila.className = 'fila';
    const dt = document.createElement('dt'); dt.textContent = etiqueta;
    const dd = document.createElement('dd');
    if (valor) dd.textContent = valor; else { dd.textContent = 'Por completar'; dd.className = 'vacio'; }
    fila.append(dt, dd); dl.append(fila);
  }
  $('#panel').scrollTop = 0;
}

function construirLista() {
  const lista = $('#lista');
  lista.replaceChildren();
  partes.forEach(pt => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-pressed', 'false');
    const muestra = document.createElement('span'); muestra.className = 'muestra'; muestra.style.background = pt.hex;
    const nombre = document.createElement('span'); nombre.textContent = pt.titulo;
    b.append(muestra, nombre);
    b.addEventListener('click', () => seleccionar(actual === pt ? null : pt));
    pt.boton = b; lista.append(b);
  });
}

const rayo = new THREE.Raycaster();
const puntero = new THREE.Vector2();
let inicio = null;
renderer.domElement.addEventListener('pointerdown', e => { inicio = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!inicio) return;
  const movio = Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) > 8 || performance.now() - inicio.t > 600;
  inicio = null;
  if (movio || !partes.length) return;
  const r = renderer.domElement.getBoundingClientRect();
  puntero.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  rayo.setFromCamera(puntero, camera);
  const golpe = rayo.intersectObjects(partes.flatMap(p => p.meshes), false)[0];
  seleccionar(golpe ? golpe.object.userData.parte : null);
});

$('#cerrar').addEventListener('click', () => seleccionar(null));

/* ==========================================================================
   6. CONTROLES Y ARRASTRE DE TARJETA
   ========================================================================== */
let listaVisible = true;
$('#btn-toggle-lista').addEventListener('click', e => {
  listaVisible = !listaVisible;
  e.currentTarget.setAttribute('aria-pressed', String(listaVisible));
  $('#lista').classList.toggle('oculto-lista', !listaVisible);
});

/* Corte Transversal */
$('#btn-corte').addEventListener('click', e => {
  corteActivo = !corteActivo;
  e.currentTarget.setAttribute('aria-pressed', String(corteActivo));
  partes.forEach(pt => {
    pt.mats.forEach(m => {
      m.clippingPlanes = corteActivo ? [planoCorte] : [];
      m.clipShadows = true;
      m.needsUpdate = true;
    });
  });
});

/* Arrastre de la tarjeta de información */
const panelEl = $('#panel');
let arrastrando = false;
let offset = { x: 0, y: 0 };

$('#panel-header').addEventListener('pointerdown', e => {
  arrastrando = true;
  const rect = panelEl.getBoundingClientRect();
  offset.x = e.clientX - rect.left;
  offset.y = e.clientY - rect.top;
  panelEl.setPointerCapture(e.pointerId);
});

$('#panel-header').addEventListener('pointermove', e => {
  if (!arrastrando) return;
  panelEl.style.left = `${e.clientX - offset.x}px`;
  panelEl.style.top = `${e.clientY - offset.y}px`;
  panelEl.style.right = 'auto';
});

$('#panel-header').addEventListener('pointerup', e => {
  arrastrando = false;
  panelEl.releasePointerCapture(e.pointerId);
});

/* Zoom Slider */
$('#zoom').addEventListener('input', e => {
  const val = e.target.value / 100;
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
  const dist = distMinCamara + val * (distMaxCamara - distMinCamara);
  camera.position.copy(controls.target).addScaledVector(dir, dist);
});

controls.addEventListener('change', () => {
  const dist = camera.position.distanceTo(controls.target);
  const val = Math.min(1, Math.max(0, (dist - distMinCamara) / (distMaxCamara - distMinCamara)));
  $('#zoom').value = val * 100;
});

$('#explosion').addEventListener('input', e => { objetivoT = e.target.value / 100; });

$('#btn-girar').setAttribute('aria-pressed', String(girarAuto));
$('#btn-girar').addEventListener('click', e => {
  girarAuto = !girarAuto;
  e.currentTarget.setAttribute('aria-pressed', String(girarAuto));
  controls.autoRotate = girarAuto && !actual;
});

$('#btn-reset').addEventListener('click', () => {
  seleccionar(null);
  objetivoT = 0; $('#explosion').value = 0;
  
  corteActivo = false;
  $('#btn-corte').setAttribute('aria-pressed', 'false');
  partes.forEach(pt => {
    pt.mats.forEach(m => { m.clippingPlanes = []; m.needsUpdate = true; });
  });

  encuadrar();
});

let espera;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(espera); });
controls.addEventListener('end', () => {
  clearTimeout(espera);
  espera = setTimeout(() => { if (girarAuto && !actual) controls.autoRotate = true; }, 12000);
});

/* ==========================================================================
   7. BUCLE DE ANIMACIÓN
   ========================================================================== */
const reloj = new THREE.Clock();
const tmpCentro = new THREE.Vector3();
const tmpAntes = new THREE.Vector3();
const tmpCaja = new THREE.Box3();

renderer.setAnimationLoop(() => {
  const dt = Math.min(reloj.getDelta(), 0.05);

  if (Math.abs(objetivoT - t) > 0.0005) { t += (objetivoT - t) * Math.min(1, dt * 7); aplicarExplosion(); }
  else if (t !== objetivoT) { t = objetivoT; aplicarExplosion(); }

  if (partes.length) {
    const destino = actual ? tmpCaja.setFromObject(actual.obj).getCenter(tmpCentro) : centroGeneral;
    tmpAntes.copy(controls.target);
    controls.target.lerp(destino, Math.min(1, dt * 5));
    camera.position.add(tmpAntes.subVectors(controls.target, tmpAntes));
  }

  controls.update();
  renderer.render(scene, camera);
});
</script>
