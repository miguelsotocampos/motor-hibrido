<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Motor híbrido interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #E7EEF2;
    --tinta: #12283A;
    --tinta-suave: #4A6072;
    --plano: #1B6F9A;
    --brasa: #E8590C;
    --tarjeta: #F8FBFC;
    --borde: rgba(18, 40, 58, .22);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--papel); color: var(--tinta);
    font-family: 'Barlow', system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  #stage {
    position: fixed; inset: 0;
    background-color: var(--papel);
    background-image:
      linear-gradient(rgba(18,40,58,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(18,40,58,.055) 1px, transparent 1px);
    background-size: 32px 32px;
    touch-action: none;
  }
  #stage canvas { display: block; touch-action: none; }

  #cabecera { position: fixed; top: 20px; left: 24px; pointer-events: none; z-index: 2; }
  #titulo {
    margin: 0; font-family: 'Barlow Condensed', system-ui, sans-serif;
    font-weight: 700; font-size: 38px; line-height: 1;
  }
  #pista { margin: 6px 0 0; color: var(--tinta-suave); font-size: 17px; }

  /* Lista reducida al 45% (Ancho 115px) */
  #lista {
    position: fixed; left: 16px; top: 100px; bottom: 210px; width: 115px;
    display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
    padding: 2px; transition: opacity 0.25s, transform 0.25s; z-index: 5;
  }
  #lista.oculto-lista { opacity: 0; pointer-events: none; transform: translateX(-20px); }
  #lista button {
    display: flex; align-items: center; gap: 6px; text-align: left;
    min-height: 36px; padding: 6px 8px;
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 6px;
    font-size: 12px; font-weight: 500;
  }
  #lista button .muestra { width: 10px; height: 10px; border-radius: 2px; flex: none; border: 1px solid rgba(18,40,58,.35); }
  #lista button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lista button[aria-pressed="true"] { border-color: var(--brasa); box-shadow: inset 3px 0 0 var(--brasa); font-weight: 600; }

  #acciones { position: fixed; top: 20px; right: 20px; display: flex; gap: 8px; z-index: 10; }
  #acciones button {
    min-height: 44px; padding: 0 14px; background: var(--tarjeta);
    border: 1px solid var(--borde); border-radius: 6px; font-size: 15px; font-weight: 500;
  }
  #acciones button[aria-pressed="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }
  #btn-fire[aria-pressed="true"] { background: var(--brasa); color: #fff; border-color: var(--brasa); }

  /* Ficha de información FIJA */
  #panel {
    position: fixed; right: 20px; top: 76px; width: min(320px, 80vw); max-height: 55vh;
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px;
    padding: 18px; overflow-y: auto; display: none;
    box-shadow: 0 8px 24px rgba(18,40,58,.15); z-index: 10;
  }
  #panel.abierto { display: block; }
  #panel-header { padding-bottom: 6px; margin-bottom: 6px; border-bottom: 2px solid var(--borde); position: relative; }
  #panel h2 { margin: 0 32px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; color: var(--brasa); }
  #cerrar { position: absolute; top: -2px; right: 0; width: 32px; height: 32px; border: 1px solid var(--borde); border-radius: 6px; background: transparent; font-size: 18px; }
  #p-desc { margin: 8px 0 12px; font-size: 15px; line-height: 1.35; }
  #p-datos .fila { padding: 6px 0; border-top: 1px solid var(--borde); }
  #p-datos dt { font-size: 12px; color: var(--tinta-suave); font-weight: 500; }
  #p-datos dd { margin: 2px 0 0; font-size: 15px; font-weight: 600; }

  #controles-contenedor {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: min(600px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 8px; z-index: 10;
  }
  .bloque-control { padding: 8px 18px 10px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; }
  .bloque-control label { display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 18px; }
  .bloque-control .fila { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--tinta-suave); }
  .bloque-control input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 38px; background: transparent; margin: 0; }
  #explosion::-webkit-slider-runnable-track, #zoom::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--plano), var(--brasa)); }
  #explosion::-webkit-slider-thumb, #zoom::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: #fff; border: 3px solid var(--tinta); }

  #estado { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(231,238,242,.92); z-index: 100; }
  #estado.oculto { display: none; }
</style>
</head>
<body>
<div id="stage"></div>

<header id="cabecera">
  <h1 id="titulo">Motor híbrido</h1>
  <p id="pista">Toca una pieza para conocerla</p>
</header>

<nav id="lista" aria-label="Piezas del motor"></nav>

<div id="acciones">
  <button id="btn-fire" type="button" aria-pressed="false">🔥 Fire Test</button>
  <button id="btn-toggle-lista" type="button" aria-pressed="true">👁️ Piezas</button>
  <button id="btn-corte" type="button" aria-pressed="false">Corte Transversal</button>
  <button id="btn-girar" type="button" aria-pressed="true">Girar solo</button>
  <button id="btn-reset" type="button">Reiniciar</button>
</div>

<aside id="panel" aria-live="polite">
  <div id="panel-header">
    <button id="cerrar" type="button">&times;</button>
    <h2 id="p-titulo"></h2>
  </div>
  <p id="p-desc"></p>
  <dl id="p-datos"></dl>
</aside>

<div id="controles-contenedor">
  <div class="bloque-control">
    <label for="explosion">Explosionar</label>
    <div class="fila">
      <span>Armado</span>
      <input id="explosion" type="range" min="0" max="100" value="0">
      <span>Explosionado</span>
    </div>
  </div>

  <div class="bloque-control">
    <label for="zoom">Zoom (Acercar/Alejar)</label>
    <div class="fila">
      <span>Cerca</span>
      <input id="zoom" type="range" min="0" max="100" value="50">
      <span>Lejos</span>
    </div>
  </div>
</div>

<div id="estado">Cargando modelo…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const CONFIG = {
  modelo: 'motor.glb',
  titulo: 'Motor híbrido',
  ensamble: 'Ensamble macho',
  ignorar: ['Cube'],
  ejeMotor: 'auto',
  expansion: 1.4,
  colorear: true,
  rotacionAutomatica: true,
  aMilimetros: 1000
};

const AL = { material: 'Aluminio 6061-T6', tempMax: 'Pérdida de resistencia > 150 °C / Fusión 660 °C' };
const FEN = { material: 'Aislante Fenólico HR', tempMax: 'Carbonizado protector 350 - 850 °C' };

const PIEZAS = {
  'grainstep': {
    titulo: 'Grano (Combustible)',
    queEs: 'Bloque de combustible sólido cilíndrico. Posee un puerto central por donde fluye el oxidante para sostener la combustión.',
    material: 'Parafina / HDPE (Polietileno)',
    tempMax: 'Fusión ~130 °C / Combustión > 2800 °C',
    presion: '35 - 45 bar'
  },
  'nozzle': {
    ...FEN,
    titulo: 'Tobera de Escape',
    queEs: 'Geometría convergente-divergente que acelera los gases de combustión a velocidades supersónicas para generar empuje.',
    presion: '40 bar'
  },
  'injerto': {
    titulo: 'Garganta / Injerto de Grafito',
    queEs: 'Sección crítica de mínima área (garganta). Resistente a la erosión térmica extrema y choque térmico del flujo de gas.',
    material: 'Grafito Isostático de alta densidad',
    tempMax: '> 3000 °C',
    presion: '45 bar'
  },
  'casing': {
    ...AL,
    titulo: 'Carcasa Principal (Casing)',
    queEs: 'Cilindro estructural contenedor de alta presión. Protege la cámara de combustión y soporta las cargas aerodinámicas.',
    presion: '60 bar (Presión de prueba)'
  },
  'phenolics': {
    ...FEN,
    titulo: 'Liner Térmico Fenólico',
    queEs: 'Camisa aislante que previene la transferencia de calor directo hacia la carcasa de aluminio.'
  },
  'pre-cc': {
    ...FEN,
    titulo: 'Precámara de Combustión',
    queEs: 'Zona de atomización y mezcla del oxidante líquido antes de entrar en contacto con el grano de combustible.'
  },
  'injector': {
    ...AL,
    titulo: 'Inyector',
    queEs: 'Elemento distribuidor con orificios calibrados. Por este componente se inyecta el óxido nitroso en estado líquido a la cámara.',
    presion: '50 - 60 bar'
  },
  'guarda': {
    ...AL,
    titulo: 'Guarda de Tobera',
    queEs: 'Estructura o casing exterior diseñada para sostener, alinear y proteger mecánicamente el ensamble de la tobera.',
    presion: 'Estructural'
  }
};

const $ = s => document.querySelector(s);
const clave = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');

function buscarInfo(nombreCad) {
  const c = clave(nombreCad);
  if (c.includes('casing') && c.includes('nozzle')) return PIEZAS['guarda'];
  for (const key in PIEZAS) {
    if (c.includes(key)) return PIEZAS[key];
  }
  return null;
}

const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.localClippingEnabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* PLANO DE CORTE LONGITUDINAL (Pasa de lado a lado cortando a la mitad) */
let planoCorte = new THREE.Plane();
let corteActivo = false;

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.autoRotateSpeed = 0.9;

function ajustarTamano() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(ajustarTamano).observe(stage);
ajustarTamano();

let partes = [];
let actual = null;
let t = 0, objetivoT = 0;
let girarAuto = CONFIG.rotacionAutomatica;
let encuadrar = () => {};
let aplicarExplosion = () => {};
let centroGeneral = new THREE.Vector3();
let distMinCamara = 0.5, distMaxCamara = 10;
let extremoTobera = new THREE.Vector3();
let direccionSalida = new THREE.Vector3();

/* SISTEMA DE PARTÍCULAS PARA FIRE TEST */
const cantParticulas = 350;
const geoParticulas = new THREE.BufferGeometry();
const posParticulas = new Float32Array(cantParticulas * 3);
const velParticulas = [];

for (let i = 0; i < cantParticulas; i++) {
  posParticulas[i * 3] = 0;
  posParticulas[i * 3 + 1] = 0;
  posParticulas[i * 3 + 2] = 0;
  velParticulas.push(new THREE.Vector3());
}
geoParticulas.setAttribute('position', new THREE.BufferAttribute(posParticulas, 3));

const matParticulas = new THREE.PointsMaterial({
  color: 0xff4500,
  size: 0.09,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending
});
const fuegoMesh = new THREE.Points(geoParticulas, matParticulas);
fuegoMesh.visible = false;
scene.add(fuegoMesh);
let fuegoActivo = false;

new GLTFLoader().load(
  CONFIG.modelo,
  gltf => {
    try { iniciar(gltf); $('#estado').classList.add('oculto'); }
    catch (e) { console.error(e); }
  }
);

function iniciar(gltf) {
  const modelo = gltf.scene;
  const ignorar = CONFIG.ignorar.map(clave);
  const quitar = [];
  modelo.traverse(o => { if (o.isCamera || o.isLight || (o !== modelo && ignorar.includes(clave(o.name)))) quitar.push(o); });
  quitar.forEach(o => o.parent && o.parent.remove(o));
  
  // CENTRADO EXACTO DE GEOMETRÍA EN EL ORIGEN (0,0,0)
  const caja = new THREE.Box3().setFromObject(modelo);
  const centro = caja.getCenter(new THREE.Vector3());
  modelo.position.sub(centro);
  
  scene.add(modelo);
  modelo.updateMatrixWorld(true);

  caja.setFromObject(modelo);
  caja.getCenter(centroGeneral);

  let objs = [];
  modelo.traverse(o => { if (o.isMesh) objs.push(o); });

  const tam = caja.getSize(new THREE.Vector3());
  const ejes = ['x', 'y', 'z'];
  const eje = CONFIG.ejeMotor === 'auto' ? ejes.reduce((a, b) => (tam[b] > tam[a] ? b : a)) : CONFIG.ejeMotor;
  const otros = ejes.filter(e => e !== eje);
  const L = tam[eje];
  const dirEje = new THREE.Vector3(); dirEje[eje] = 1;
  const dirArriba = eje === 'y' ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);

  // CONFIGURACIÓN DEL PLANO DE CORTE RESPECTO A LA ORIENTACIÓN DEL MODELO
  const normalLateral = new THREE.Vector3(1, 0, 0).applyQuaternion(modelo.quaternion).normalize();
  planoCorte.setFromNormalAndCoplanarPoint(normalLateral, centroGeneral);

  partes = objs.map(obj => {
    const pt = { obj, meshes: [obj], mats: [] };
    pt.clave = clave(obj.name);
    pt.info = buscarInfo(obj.name);
    pt.titulo = (pt.info && pt.info.titulo) || obj.name;

    const m = obj;
    m.material = Array.isArray(m.material) ? m.material.map(x => x.clone()) : m.material.clone();
    (Array.isArray(m.material) ? m.material : [m.material]).forEach(x => { 
      x.side = THREE.DoubleSide; 
      pt.mats.push(x); 
    });
    m.userData.parte = pt;

    const cajaP = new THREE.Box3().setFromObject(obj);
    const c = cajaP.getCenter(new THREE.Vector3());
    pt.rel = L > 0 ? c[eje] / L : 0;

    const s = cajaP.getSize(new THREE.Vector3());
    const largo = Math.round(s[eje] * CONFIG.aMilimetros);
    const diam = Math.round(Math.max(s[otros[0]], s[otros[1]]) * CONFIG.aMilimetros);
    pt.medidasModelo = 'Largo ' + largo + ' mm, diámetro ' + diam + ' mm';
    return pt;
  });

  partes.sort((a, b) => a.rel - b.rel);

  // Localizar extremo de la tobera para la emisión de partículas del Fire Test
  let piezaTobera = partes.find(p => p.clave.includes('nozzle')) || partes[0];
  const cajaTobera = new THREE.Box3().setFromObject(piezaTobera.obj);
  cajaTobera.getCenter(extremoTobera);
  
  direccionSalida.copy(extremoTobera).sub(centroGeneral).normalize();

  partes.forEach((pt, i) => {
    const color = new THREE.Color().setHSL((i * 0.618034) % 1, 0.5, 0.58);
    let hex = '#9AAAB6';
    pt.mats.forEach(m => {
      if (CONFIG.colorear && m.color) { m.color.copy(color); }
      if (m.color) hex = '#' + m.color.getHexString();
    });
    pt.hex = hex;

    const ex = (pt.info && pt.info.explosion) || {};
    const axial = typeof ex.axial === 'number' ? ex.axial : pt.rel * CONFIG.expansion;
    const lift = typeof ex.lift === 'number' ? ex.lift : 0;
    const mundo = dirEje.clone().multiplyScalar(axial * L).addScaledVector(dirArriba, lift * L);
    const padre = pt.obj.parent;
    padre.updateWorldMatrix(true, false);
    const inv = new THREE.Matrix4().copy(padre.matrixWorld).invert();
    const origen = new THREE.Vector3().applyMatrix4(inv);
    pt.base = pt.obj.position.clone();
    pt.desplazamiento = mundo.applyMatrix4(inv).sub(origen);
  });

  aplicarExplosion = () => {
    partes.forEach(pt => pt.obj.position.copy(pt.base).addScaledVector(pt.desplazamiento, t));
  };

  const luz = new THREE.DirectionalLight(0xffffff, 1.3);
  luz.position.set(1, 2, 1.5).multiplyScalar(Math.max(L, 0.1));
  scene.add(luz);

  const vista = (eje === 'z' ? new THREE.Vector3(1, 0.3, 0.25) : new THREE.Vector3(0.25, 0.3, 1)).normalize();
  
  encuadrar = () => {
    const dist = L * 1.5;
    distMinCamara = dist * 0.25;
    distMaxCamara = dist * 2.2;
    camera.position.copy(centroGeneral).addScaledVector(vista, dist);
    controls.target.copy(centroGeneral);
    controls.minDistance = distMinCamara;
    controls.maxDistance = distMaxCamara;
    controls.update();
    $('#zoom').value = 50;
  };
  encuadrar();
  controls.autoRotate = girarAuto;
  construirLista();
}

/* MODO RAYOS X (TRANSPARENCIA AL SELECCIONAR) */
function estadoVisual(pt, modo) {
  for (const m of pt.mats) {
    if ('emissive' in m) {
      if (modo === 'sel') { m.emissive.set(0xE8590C); m.emissiveIntensity = 0.5; }
      else { m.emissive.set(0x000000); m.emissiveIntensity = 0; }
    }
    m.transparent = (modo === 'dim');
    m.opacity = (modo === 'dim') ? 0.2 : 1.0;
    m.depthWrite = (modo !== 'dim');
  }
}

function seleccionar(pt) {
  actual = pt;
  partes.forEach(p => {
    const esSeleccionada = (p === pt);
    estadoVisual(p, !pt ? 'normal' : (esSeleccionada ? 'sel' : 'dim'));
    if (p.boton) p.boton.setAttribute('aria-pressed', String(esSeleccionada));
  });
  mostrarFicha(pt);
}

function mostrarFicha(pt) {
  const panel = $('#panel');
  panel.classList.toggle('abierto', !!pt);
  if (!pt) return;

  const info = pt.info || {};
  $('#p-titulo').textContent = pt.titulo;
  $('#p-desc').textContent = info.queEs || 'Componente estructural calibrado del ensamble del motor.';
  const filas = [
    ['Material', info.material || 'Aleación de grado aeroespacial'],
    ['Temperatura límite', info.tempMax || 'Resistencia térmica estándar'],
    ['Presión de trabajo', info.presion || 'Nominal de cámara'],
    ['Medidas', info.medidas || pt.medidasModelo]
  ];
  const dl = $('#p-datos');
  dl.replaceChildren();
  for (const [etiqueta, valor] of filas) {
    const fila = document.createElement('div'); fila.className = 'fila';
    const dt = document.createElement('dt'); dt.textContent = etiqueta;
    const dd = document.createElement('dd'); dd.textContent = valor;
    fila.append(dt, dd); dl.append(fila);
  }
}

function construirLista() {
  const lista = $('#lista');
  lista.replaceChildren();
  partes.forEach(pt => {
    const b = document.createElement('button');
    b.type = 'button';
    const muestra = document.createElement('span'); muestra.className = 'muestra'; muestra.style.background = pt.hex;
    const nombre = document.createElement('span'); nombre.textContent = pt.titulo;
    b.append(muestra, nombre);
    b.addEventListener('click', () => seleccionar(actual === pt ? null : pt));
    pt.boton = b; lista.append(b);
  });
}

const rayo = new THREE.Raycaster();
const puntero = new THREE.Vector2();
renderer.domElement.addEventListener('pointerup', e => {
  const r = renderer.domElement.getBoundingClientRect();
  puntero.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  rayo.setFromCamera(puntero, camera);
  const golpe = rayo.intersectObjects(partes.flatMap(p => p.meshes), false)[0];
  seleccionar(golpe ? golpe.object.userData.parte : null);
});

$('#cerrar').addEventListener('click', () => seleccionar(null));

/* LISTA OCULTABLE */
let listaVisible = true;
$('#btn-toggle-lista').addEventListener('click', e => {
  listaVisible = !listaVisible;
  e.currentTarget.setAttribute('aria-pressed', String(listaVisible));
  $('#lista').classList.toggle('oculto-lista', !listaVisible);
});

/* CORTE TRANSVERSAL LATERAL */
$('#btn-corte').addEventListener('click', e => {
  corteActivo = !corteActivo;
  e.currentTarget.setAttribute('aria-pressed', String(corteActivo));
  partes.forEach(pt => {
    pt.mats.forEach(m => {
      m.clippingPlanes = corteActivo ? [planoCorte] : [];
      m.needsUpdate = true;
    });
  });
});

/* FIRE TEST SIMULADOR */
$('#btn-fire').addEventListener('click', e => {
  fuegoActivo = !fuegoActivo;
  e.currentTarget.setAttribute('aria-pressed', String(fuegoActivo));
  fuegoMesh.visible = fuegoActivo;
});

/* CONTROLES ZOOM / EXPLOSIÓN */
$('#zoom').addEventListener('input', e => {
  const val = e.target.value / 100;
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
  const dist = distMinCamara + val * (distMaxCamara - distMinCamara);
  camera.position.copy(controls.target).addScaledVector(dir, dist);
});

$('#explosion').addEventListener('input', e => { objetivoT = e.target.value / 100; });
$('#btn-girar').addEventListener('click', e => {
  girarAuto = !girarAuto;
  e.currentTarget.setAttribute('aria-pressed', String(girarAuto));
  controls.autoRotate = girarAuto;
});

$('#btn-reset').addEventListener('click', () => {
  seleccionar(null);
  objetivoT = 0; $('#explosion').value = 0;
  corteActivo = false;
  fuegoActivo = false;
  fuegoMesh.visible = false;
  $('#btn-corte').setAttribute('aria-pressed', 'false');
  $('#btn-fire').setAttribute('aria-pressed', 'false');
  partes.forEach(pt => { pt.mats.forEach(m => { m.clippingPlanes = []; }); });
  encuadrar();
});

/* ANIMACIÓN Y FUEGO POR LA TOBERA */
const reloj = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(reloj.getDelta(), 0.05);
  if (Math.abs(objetivoT - t) > 0.0005) { t += (objetivoT - t) * Math.min(1, dt * 7); aplicarExplosion(); }

  if (fuegoActivo) {
    const pos = geoParticulas.attributes.position.array;
    for (let i = 0; i < cantParticulas; i++) {
      if (velParticulas[i].lengthSq() === 0 || pos[i * 3] * direccionSalida.x + pos[i * 3 + 1] * direccionSalida.y + pos[i * 3 + 2] * direccionSalida.z > 2.5) {
        pos[i * 3] = extremoTobera.x + (Math.random() - 0.5) * 0.04;
        pos[i * 3 + 1] = extremoTobera.y + (Math.random() - 0.5) * 0.04;
        pos[i * 3 + 2] = extremoTobera.z + (Math.random() - 0.5) * 0.04;
        
        velParticulas[i].copy(direccionSalida).multiplyScalar(1.8 + Math.random() * 2.2);
        velParticulas[i].x += (Math.random() - 0.5) * 0.25;
        velParticulas[i].y += (Math.random() - 0.5) * 0.25;
        velParticulas[i].z += (Math.random() - 0.5) * 0.25;
      } else {
        pos[i * 3] += velParticulas[i].x * dt;
        pos[i * 3 + 1] += velParticulas[i].y * dt;
        pos[i * 3 + 2] += velParticulas[i].z * dt;
      }
    }
    geoParticulas.attributes.position.needsUpdate = true;
  }

  controls.update();
  renderer.render(scene, camera);
});
</script>
